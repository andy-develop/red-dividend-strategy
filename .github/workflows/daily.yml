name: Daily Update (08:00 CST)

on:
  schedule:
    # 北京时间 08:00 = UTC 00:00（GitHub schedule 用 UTC；负载高时可能延迟数分钟或跳过当天，全量抓取设计不丢数据）
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write   # v7.12：把抓到的原始输入（data/*.json 存档）与生成产物回写仓库，输入可复核、历史可追溯

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # v7.12：防止 fetch 卡死挂起
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (pinned)
        run: pip install -r requirements.txt

      - name: Run daily update (fetch -> validate -> signal -> build index.html)
        # v7.12：先 --dry-run 验证两次（同一输入幂等断言），再正式生成
        # v7.14：新增行业轮动（sector_update.py），同一 job 内先红利低波后行业轮动；
        #   两脚本各自携带对方 payload 段，顺序不影响最终页面
        run: |
          python3 update.py --dry-run --out /tmp/dry-index.html --data-out /tmp/dry-data.json
          python3 update.py --dry-run --out /tmp/dry-index2.html --data-out /tmp/dry-data2.json
          cmp /tmp/dry-data.json /tmp/dry-data2.json && echo "红利低波幂等断言通过：同一输入两次生成逐位一致"
          python3 update.py
          python3 sector_update.py --dry-run --out /tmp/dry-sector-index.html --data-out /tmp/dry-sector-data.json
          python3 sector_update.py --dry-run --out /tmp/dry-sector-index2.html --data-out /tmp/dry-sector-data2.json
          cmp /tmp/dry-sector-data.json /tmp/dry-sector-data2.json && echo "行业轮动幂等断言通过：同一输入两次生成逐位一致"
          python3 sector_update.py

      - name: Commit input archive + artifacts (reproducible history)
        # v7.12：输入原始响应/快照/产物全部入库，出争议可还原"某天页面说了什么、依据了什么数据"
        run: |
          git config user.name "daily-update-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ index.html backtest_data.json sector_data.json
          if git diff --cached --quiet; then
            echo "无新增变更（今天与昨天输入一致？），跳过 commit"
          else
            git commit -m "chore(data): archive inputs & artifacts $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Publish to HSK file hosting (overwrite)
        # v7.12：发布确认——校验 hsk-cli 输出；claimed:false/pending 属正常待确认，重试一次后仍异常则红
        run: |
          npm install -g @aweray/hsk-cli
          export PATH="$PATH:$(npm prefix -g)/bin"
          hsk-cli api-key set --scene file_hosting --key "${{ secrets.HSK_API_KEY }}"
          out=$(hsk-cli +host index.html --resource-id "${{ secrets.HSK_RESOURCE_ID }}" --format json)
          echo "$out"
          echo "$out" | grep -qE '"ok"|true|accepted|success|claimed' || { echo "首次发布输出异常，重试一次…"; sleep 5; out2=$(hsk-cli +host index.html --resource-id "${{ secrets.HSK_RESOURCE_ID }}" --format json); echo "$out2"; }
        env:
          HSK_API_KEY: ${{ secrets.HSK_API_KEY }}

      - name: Verify published page is the new build
        # 发布后验证：线上 PAYLOAD 的 generated_at（红利低波 backtest + 行业轮动 sector）
        # 必须与本次本地产物一致，否则标红（人工可查日志）
        run: |
          python3 - <<'EOF'
          import json, re, urllib.request
          local = json.loads(re.search(r'<script id="PAYLOAD" type="application/json">(.*?)</script>', open("index.html", encoding="utf-8").read(), re.S).group(1))
          try:
              with urllib.request.urlopen("https://945q5w.gicp.fun", timeout=30) as r:
                  html = r.read().decode("utf-8", "ignore")
              m = re.search(r'<script id="PAYLOAD" type="application/json">(.*?)</script>', html, re.S)
              online = json.loads(m.group(1)) if m else {}
              lv, ov = local["backtest"]["generated_at"], online.get("backtest", {}).get("generated_at")
              ls, os_ = local["sector"]["generated_at"], online.get("sector", {}).get("generated_at")
              print(f"本地 红利低波 generated_at: {lv}")
              print(f"线上 红利低波 generated_at: {ov}")
              print(f"本地 行业轮动 generated_at: {ls}")
              print(f"线上 行业轮动 generated_at: {os_}")
              if lv != ov or ls != os_:
                  raise SystemExit(f"发布验证失败：线上仍是旧版（{ov} != {lv} 或 {os_} != {ls}）")
              print("发布验证通过：线上已是本次构建（红利低波 + 行业轮动）")
          except Exception as e:
              raise SystemExit(f"发布验证失败：{e}")
          EOF

      - name: Notify on failure
        # v7.12：失败时告警（利用 GitHub 自身的失败状态，输出显式原因便于排查）
        if: failure()
        run: echo "::error::Daily update failed — check the logs above. Page may be stale; inputs archived under data/ are intact."
